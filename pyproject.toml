[project]
name = "dr-detect"
version = "0.1.0"
description = "Diabetic Retinopathy stage detection with EfficientNet + CORAL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pillow>=10.4",
    "tensorflow>=2.16",
    "streamlit>=1.38",
    "kaggle>=1.6",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_detect"]

[tool.uv]
package = true
