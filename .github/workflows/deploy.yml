name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/udithsandaruwan2/diabetic-retinopathy-detection:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart the server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DJANGO_SECRET_KEY,GEMINI_API_KEY,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            sudo mkdir -p /opt/retina
            sudo chown ubuntu:ubuntu /opt/retina
            if [ ! -d /opt/retina/.git ]; then
              git clone https://github.com/udithsandaruwan2/diabetic-retinopathy-detection.git /opt/retina
            fi
            cd /opt/retina
            git fetch origin main
            git reset --hard origin/main
            umask 077
            printf 'DJANGO_SECRET_KEY=%s\nGEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-3.1-flash-lite\n' "$DJANGO_SECRET_KEY" "$GEMINI_API_KEY" > .env
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
