<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Retina{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #06080d;
      --ink: #f4f7fb;
      --muted: #9aabbd;
      --line: rgba(160, 198, 235, 0.16);
      --card: rgba(12, 20, 32, 0.78);
      --blue: #8ecbff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100vh;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(1100px 520px at 78% -8%, rgba(70, 150, 230, 0.22), transparent 58%),
        radial-gradient(800px 480px at -10% 8%, rgba(30, 70, 130, 0.22), transparent 55%),
        linear-gradient(180deg, #070b12 0%, #06080d 40%, #06080d 100%);
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
    nav {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      background: rgba(6, 8, 13, 0.72);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 26px;
      letter-spacing: -0.03em;
    }
    .mark {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1px solid rgba(170, 210, 255, 0.55);
      background: radial-gradient(circle at 40% 40%, #d7ecff, #1a3d66 55%, #071018 80%);
      box-shadow: 0 0 18px rgba(120, 180, 255, 0.35);
    }
    .links { display: flex; align-items: center; gap: 22px; font-size: 14px; color: var(--muted); }
    .links a.active { color: var(--ink); }
    .links a.go {
      color: #041018;
      background: linear-gradient(180deg, #f7fbff, #c5ddf5);
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 10px 30px rgba(90, 150, 220, 0.25);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: center;
      padding: 54px 0 28px;
    }
    @media (max-width: 900px) {
      .hero, .flow, .desk-grid, .grid3 { grid-template-columns: 1fr !important; }
      nav { flex-wrap: wrap; }
    }
    h1 {
      margin: 0;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: clamp(44px, 5.2vw, 64px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }
    h1 em { font-style: normal; font-weight: 500; color: #d7ebff; }
    .lede { margin: 18px 0 0; color: var(--muted); font-size: 17px; line-height: 1.55; max-width: 46ch; }
    .row { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
    .btn, button.solid, button.quiet {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 12px 18px;
      font: 500 14px/1 "Outfit", "Avenir Next", sans-serif;
      cursor: pointer;
    }
    .btn, button.solid {
      border: 0;
      background: linear-gradient(180deg, #4aa2ff, #1d6fe0);
      color: white;
      box-shadow: 0 10px 40px rgba(40, 120, 230, 0.35);
    }
    .btn.line, button.quiet {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .window {
      border: 1px solid rgba(160, 200, 240, 0.22);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(16, 28, 44, 0.95), rgba(8, 12, 20, 0.95));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), 0 0 80px rgba(60, 120, 200, 0.12);
      overflow: hidden;
    }
    .chrome {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2a3c52; }
    .dot:first-child { background: #6ea8e0; }
    .pane { display: grid; grid-template-columns: 1.1fr 0.9fr; min-height: 280px; }
    .fundus {
      margin: 16px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 58% 48%, rgba(255, 230, 170, 0.95) 0 7%, transparent 8%),
        radial-gradient(circle at 42% 46%, #5a1014 0 18%, #8a1c18 28%, #2a0c10 46%, #05070c 62%);
      position: relative;
      min-height: 240px;
    }
    .fundus::after {
      content: "";
      position: absolute;
      inset: 18% 22%;
      border-radius: 40% 50%;
      border: 1px solid rgba(255, 180, 140, 0.25);
      box-shadow: inset 0 0 40px rgba(255, 80, 40, 0.15);
    }
    .sidepane { padding: 16px 16px 16px 0; display: grid; gap: 10px; align-content: center; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(8, 14, 22, 0.6);
    }
    .pill b { display: block; font-size: 14px; }
    .pill span { color: var(--muted); font-size: 12px; }
    .flow {
      margin: 18px 0 56px;
      display: grid;
      grid-template-columns: 1fr 200px 1fr;
      gap: 16px;
      align-items: center;
    }
    .stack { display: grid; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .card b { display: block; font-weight: 600; font-size: 14px; }
    .card span, .card p { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 4px 0 0; }
    .core {
      height: 168px;
      border-radius: 32px;
      border: 1px solid rgba(170, 214, 255, 0.5);
      background:
        radial-gradient(circle at 50% 42%, rgba(210, 235, 255, 0.55), rgba(40, 90, 150, 0.2) 36%, rgba(8, 14, 22, 0.15) 68%);
      display: grid;
      place-items: center;
      text-align: center;
      box-shadow: 0 0 90px rgba(80, 150, 230, 0.22);
    }
    .core strong {
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: 32px;
      letter-spacing: -0.04em;
    }
    .core small { display: block; color: #d5e6f8; margin-top: 4px; letter-spacing: 0.08em; font-size: 11px; text-transform: uppercase; }
    .section { padding: 8px 0 64px; }
    .section h2, .prose h2 {
      margin: 0 0 8px;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: 36px;
      letter-spacing: -0.04em;
    }
    .kicker {
      font-family: "Outfit", "Avenir Next", sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 10px;
    }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
    .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 22px; }
    @media (max-width: 800px) { .stages, .shots, .pane { grid-template-columns: 1fr; } .sidepane { padding: 0 16px 16px; } }
    .stages div { border-top: 1px solid var(--line); padding-top: 12px; }
    .stages b { display: block; font-variant-numeric: tabular-nums; font-size: 18px; }
    .stages span { color: var(--muted); font-size: 13px; }
    footer {
      border-top: 1px solid var(--line);
      padding: 20px 0 36px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--ink); border-bottom: 1px solid rgba(244,247,251,0.3); }
    .desk { padding: 36px 0 48px; }
    .desk h1 { font-size: clamp(40px, 5vw, 60px); }
    .desk-grid { display: grid; grid-template-columns: 300px 1fr; gap: 28px; margin-top: 22px; }
    label.file {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      color: var(--ink);
    }
    input[type=file] { display: none; }
    button:disabled { opacity: 0.5; cursor: progress; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    #status { color: var(--muted); font-size: 13px; min-height: 2.6em; }
    .reading { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .reading em {
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-style: normal;
      font-size: 48px;
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.04em;
    }
    .reading b { font-family: "Outfit", "Avenir Next", sans-serif; font-size: 32px; font-weight: 500; letter-spacing: -0.03em; }
    .mono { font-family: "Outfit", "Avenir Next", sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .shots img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; border-radius: 12px; display: block; border: 1px solid var(--line); }
    .shots figcaption { margin-top: 8px; }
    figure { margin: 0; }
    canvas { width: 100%; height: 260px; display: block; margin-top: 8px; border-radius: 12px; border: 1px solid var(--line); }
    .hidden { display: none; }
    .prose { max-width: 68ch; padding: 48px 0 24px; }
    .prose h1 { font-size: clamp(40px, 5vw, 60px); }
    .prose p { color: #c9d5e2; line-height: 1.65; font-size: 17px; }
    .prose a { color: var(--ink); border-bottom: 1px solid rgba(244,247,251,0.35); }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="/"><span class="mark"></span> Retina</a>
      <div class="links">
        <a href="/" class="{% if page == 'home' %}active{% endif %}">Home</a>
        <a href="/product" class="{% if page == 'product' %}active{% endif %}">Product</a>
        <a href="/about" class="{% if page == 'about' %}active{% endif %}">About</a>
        <a class="go" href="/product">Open screen</a>
      </div>
    </nav>
    {% block content %}{% endblock %}
    <footer>
      <span>{{ disclaimer }}</span>
      <span>Developed by <a href="{{ developer_url }}">udithsandaruwan.com</a></span>
    </footer>
  </div>
  {% block script %}{% endblock %}
</body>
</html>
