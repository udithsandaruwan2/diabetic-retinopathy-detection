<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Retina{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #06080d;
      --ink: #f4f7fb;
      --muted: #9aabbd;
      --line: rgba(160, 198, 235, 0.16);
      --card: rgba(12, 20, 32, 0.78);
      --blue: #8ecbff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100vh;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(1100px 520px at 78% -8%, rgba(70, 150, 230, 0.22), transparent 58%),
        radial-gradient(800px 480px at -10% 8%, rgba(30, 70, 130, 0.22), transparent 55%),
        linear-gradient(180deg, #070b12 0%, #06080d 40%, #06080d 100%);
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(6, 8, 13, 0.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: -0.03em;
    }
    .mark {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1px solid rgba(170, 210, 255, 0.55);
      background: radial-gradient(circle at 40% 40%, #d7ecff, #1a3d66 55%, #071018 80%);
    }
    .links { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); }
    .links a {
      padding: 8px 12px;
      border-radius: 999px;
    }
    .links a.active { color: var(--ink); background: rgba(255, 255, 255, 0.06); }
    .links a.go {
      margin-left: 8px;
      color: #041018;
      background: linear-gradient(180deg, #f7fbff, #c5ddf5);
      font-weight: 500;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: center;
      padding: 54px 0 28px;
    }
    @media (max-width: 900px) {
      .hero, .flow, .desk-grid, .grid3, .bench, .assist { grid-template-columns: 1fr !important; }
      .bar-inner { height: auto; padding: 12px 0; }
    }
    h1 {
      margin: 0;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: clamp(44px, 5.2vw, 64px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }
    h1 em { font-style: normal; font-weight: 500; color: #d7ebff; }
    .lede { margin: 18px 0 0; color: var(--muted); font-size: 17px; line-height: 1.55; max-width: 46ch; }
    .row { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
    .btn, button.solid, button.quiet {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 12px 18px;
      font: 500 14px/1 "Outfit", "Avenir Next", sans-serif;
      cursor: pointer;
    }
    .btn, button.solid {
      border: 0;
      background: linear-gradient(180deg, #4aa2ff, #1d6fe0);
      color: white;
      box-shadow: 0 10px 40px rgba(40, 120, 230, 0.35);
    }
    .btn.line, button.quiet {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .window {
      border: 1px solid rgba(160, 200, 240, 0.22);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(16, 28, 44, 0.95), rgba(8, 12, 20, 0.95));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), 0 0 80px rgba(60, 120, 200, 0.12);
      overflow: hidden;
    }
    .chrome {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2a3c52; }
    .dot:first-child { background: #6ea8e0; }
    .pane { display: grid; grid-template-columns: 1.1fr 0.9fr; min-height: 280px; }
    .fundus {
      margin: 16px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 58% 48%, rgba(255, 230, 170, 0.95) 0 7%, transparent 8%),
        radial-gradient(circle at 42% 46%, #5a1014 0 18%, #8a1c18 28%, #2a0c10 46%, #05070c 62%);
      position: relative;
      min-height: 240px;
    }
    .fundus::after {
      content: "";
      position: absolute;
      inset: 18% 22%;
      border-radius: 40% 50%;
      border: 1px solid rgba(255, 180, 140, 0.25);
      box-shadow: inset 0 0 40px rgba(255, 80, 40, 0.15);
    }
    .sidepane { padding: 16px 16px 16px 0; display: grid; gap: 10px; align-content: center; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(8, 14, 22, 0.6);
    }
    .pill b { display: block; font-size: 14px; }
    .pill span { color: var(--muted); font-size: 12px; }
    .flow {
      margin: 18px 0 56px;
      display: grid;
      grid-template-columns: 1fr 200px 1fr;
      gap: 16px;
      align-items: center;
    }
    .stack { display: grid; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .card b { display: block; font-weight: 600; font-size: 14px; }
    .card span, .card p { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 4px 0 0; }
    .core {
      height: 168px;
      border-radius: 32px;
      border: 1px solid rgba(170, 214, 255, 0.5);
      background:
        radial-gradient(circle at 50% 42%, rgba(210, 235, 255, 0.55), rgba(40, 90, 150, 0.2) 36%, rgba(8, 14, 22, 0.15) 68%);
      display: grid;
      place-items: center;
      text-align: center;
      box-shadow: 0 0 90px rgba(80, 150, 230, 0.22);
    }
    .core strong {
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: 32px;
      letter-spacing: -0.04em;
    }
    .core small { display: block; color: #d5e6f8; margin-top: 4px; letter-spacing: 0.08em; font-size: 11px; text-transform: uppercase; }
    .section { padding: 8px 0 64px; }
    .section h2, .prose h2 {
      margin: 0 0 8px;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: 36px;
      letter-spacing: -0.04em;
    }
    .kicker {
      font-family: "Outfit", "Avenir Next", sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 10px;
    }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
    .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 22px; }
    @media (max-width: 800px) { .stages, .shots, .pane { grid-template-columns: 1fr; } .sidepane { padding: 0 16px 16px; } }
    .stages div { border-top: 1px solid var(--line); padding-top: 12px; }
    .stages b { display: block; font-variant-numeric: tabular-nums; font-size: 18px; }
    .stages span { color: var(--muted); font-size: 13px; }
    footer {
      border-top: 1px solid var(--line);
      padding: 20px 0 36px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--ink); border-bottom: 1px solid rgba(244,247,251,0.3); }
    .desk { padding: 28px 0 48px; }
    .desk h1 { font-size: clamp(40px, 5vw, 56px); }
    .bench { display: grid; grid-template-columns: 280px 1fr; gap: 16px; margin-top: 22px; align-items: start; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(10, 16, 26, 0.72);
      padding: 16px;
    }
    .brain { display: flex; flex-direction: column; padding: 14px 14px 12px; }
    .brain-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px 18px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .strip span { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 999px; border: 1px solid transparent; }
    .strip span.on { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,0.05); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 18px; height: 2px; background: rgba(180, 214, 245, 0.7); display: inline-block; }
    .swatch.node { width: 7px; height: 7px; border-radius: 50%; background: #eef3f8; }
    label.file {
      display: grid;
      gap: 4px;
      padding: 16px;
      border: 1px dashed rgba(160, 198, 235, 0.35);
      border-radius: 14px;
      cursor: pointer;
      color: var(--ink);
    }
    label.file:hover { border-color: rgba(160, 198, 235, 0.7); }
    label.file small { color: var(--muted); }
    input[type=file] { display: none; }
    button:disabled { opacity: 0.5; cursor: progress; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    #status { color: var(--muted); font-size: 13px; min-height: 2.6em; }
    .reading { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .reading em {
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      font-style: normal;
      font-size: 48px;
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.04em;
    }
    .reading b { font-family: "Outfit", "Avenir Next", sans-serif; font-size: 32px; font-weight: 500; letter-spacing: -0.03em; }
    .mono { font-family: "Outfit", "Avenir Next", sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .shots img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; border-radius: 12px; display: block; border: 1px solid var(--line); }
    .shots figcaption { margin-top: 8px; }
    .assist { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 16px; margin-top: 16px; }
    .note dl { margin: 12px 0 0; display: grid; gap: 12px; }
    .note dt { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .note dd { margin: 4px 0 0; color: #d5e0ea; line-height: 1.5; font-size: 15px; }
    .thread { display: flex; flex-direction: column; min-height: 280px; }
    .hint { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .chat-log { margin: 12px 0; display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow: auto; }
    .bubble { margin: 0; line-height: 1.5; font-size: 14px; }
    .bubble b { display: block; font-weight: 500; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    .bubble.you { color: var(--ink); }
    .bubble.ai { color: #d5e0ea; }
    .think { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; min-height: 22px; }
    .mind { width: 28px; height: 28px; flex: none; }
    .mind circle { fill: #e7f2ff; transform-box: fill-box; transform-origin: center; animation: fire 1.3s ease-in-out infinite; }
    .mind circle:nth-child(2) { animation-delay: 0.15s; }
    .mind circle:nth-child(3) { animation-delay: 0.3s; }
    .mind path { fill: none; stroke: rgba(180, 214, 245, 0.7); stroke-width: 1; }
    @keyframes fire { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .mind circle { animation: none; }
    }
    .ask { display: flex; gap: 8px; margin-top: auto; }
    .ask input {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font: 15px "Outfit", "Avenir Next", sans-serif;
      padding: 10px 14px;
    }
    .ask input:focus { outline: none; border-color: rgba(126, 200, 255, 0.7); }
    figure { margin: 0; }
    #result { scroll-margin-top: 80px; }
    #net { width: 100%; height: 460px; display: block; border: 0; border-radius: 12px; background: radial-gradient(480px 220px at 50% 42%, rgba(40, 80, 130, 0.28), transparent 70%); }
    .steps { list-style: none; padding: 14px 0 0; margin: 14px 0 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }
    .steps li { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .steps b { display: block; color: var(--ink); font-weight: 500; }
    .hidden { display: none; }
    .prose { max-width: 68ch; padding: 48px 0 24px; }
    .prose h1 { font-size: clamp(40px, 5vw, 60px); }
    .prose p { color: #c9d5e2; line-height: 1.65; font-size: 17px; }
    .prose a { color: var(--ink); border-bottom: 1px solid rgba(244,247,251,0.35); }
    @media (max-width: 800px) {
      .shots { grid-template-columns: 1fr; }
      #net { height: 320px; }
      .reading { align-items: flex-start; }
      .reading em { font-size: 36px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="wrap bar-inner">
      <a class="brand" href="/"><span class="mark"></span> Retina</a>
      <nav class="links">
        <a href="/" class="{% if page == 'home' %}active{% endif %}">Home</a>
        <a href="/product" class="{% if page == 'product' %}active{% endif %}">Product</a>
        <a href="/about" class="{% if page == 'about' %}active{% endif %}">About</a>
        {% if page != 'product' %}<a class="go" href="/product">Open screen</a>{% endif %}
      </nav>
    </div>
  </header>
  <div class="wrap">
    {% block content %}{% endblock %}
    <footer>
      <span>{{ disclaimer }}</span>
      <span>Developed by <a href="{{ developer_url }}">udithsandaruwan.com</a></span>
    </footer>
  </div>
  {% block script %}{% endblock %}
</body>
</html>
